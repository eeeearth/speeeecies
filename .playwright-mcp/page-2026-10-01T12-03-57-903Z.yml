  - main [ref=f3e13]:
    - heading "Locales" [level=1] [ref=f3e14]
    - paragraph [ref=f3e15]:
      - text: "A locale is a public place the live simulation can show: a city or district centroid, its climate, a generic plot, the plants its garden shows, and at least 8 species from the gallery (aim for 12 or more). A locale joins the live rotation after its pull request is merged, CI passes, and the maintainers' import succeeds; see"
      - link "AGENTS.md" [ref=f3e16] [cursor=pointer]:
        - /url: docs/AGENTS.md
      - text: ("Contribute a locale") to add one, and
      - link "locale-richness.md" [ref=f3e17] [cursor=pointer]:
        - /url: docs/locale-richness.md
      - text: for why these targets matter. A locale without a
      - code [ref=f3e18]: flora-catalog.json
      - text: gets a default plant catalog for its climate.
    - paragraph [ref=f3e19]:
      - text: Want a place that isn't here? Take an open
      - link [ref=f3e20] [cursor=pointer]:
        - /url: https://github.com/jt55401/speeeecies/issues?q=is%3Aissue+is%3Aopen+label%3Alocale-request
        - code [ref=f3e21]: locale-request
        - text: issue
      - text: ", or open one. A validated locale enters the rotation automatically, and its pull request gets a comment when it first appears on the"
      - link "stream" [ref=f3e22] [cursor=pointer]:
        - /url: https://www.youtube.com/@jt55401/live
      - text: .
